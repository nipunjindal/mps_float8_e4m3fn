[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[project]
name = "python_base"
version = "0.0.1"
description = "A visual, hands-on lab for PyTorch 2.15 on Apple Silicon."
requires-python = ">=3.11"
readme = "README.md"
keywords = ["pytorch", "mps", "float8", "apple-silicon"]
authors = [{name = "Nipun Jindal", email = "njindal@adobe.com"}]
# Runtime dependencies
dependencies = [
  "torch>=2.15,<2.16",
  "torchvision",
  "matplotlib",
  "numpy"
]

[project.optional-dependencies]
# Development-only utilities
dev = [
  "pytest",
  "ruff",
  "ty",
  "toml-sort",
  "shfmt-py",
  "ipykernel",
  "pre-commit"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
# Ruff-format configuration.
line-length = 120
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv"
]
# PyTorch 2.15 requires Python 3.11 or newer.
target-version = "py311"
